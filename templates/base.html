<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0908">
<link rel="preload" href="{{ url_for('static', filename='fonts/cinzel.woff') }}" as="font" type="font/woff" crossorigin>
<title>{% block title %}Faded Art – Ihr Foto als String Art{% endblock %}</title>
<meta name="description" content="{% block desc %}Dein Foto als Fadenbild: hochladen, drei Varianten ansehen, Holz und Größe wählen und sicher bestellen. Faded Art aus Feldkirchen bei München.{% endblock %}">
<meta property="og:title" content="Faded Art">
<meta property="og:description" content="Dein Foto als Fadenbild aus Schwarz und Weiß, berechnet und gespannt in Feldkirchen bei München.">
<meta property="og:type" content="website">
<meta property="og:image" content="{{ url_for('static', filename='img/teilen.jpg', _external=True) }}">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="{{ url_for('static', filename='img/siegel.svg') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css', v=asset_v('style.css')) }}">
<link rel="stylesheet" href="{{ url_for('static', filename='home.css', v=asset_v('home.css')) }}">
{% block head %}{% endblock %}
</head>
<body class="v2 {% block body_class %}page{% endblock %}">
<div class="wrap">
<header class="top" id="top">
  <a href="/" class="logo gold-text">FADED ART</a>
  <div class="head-right"><a href="/warenkorb" class="cartlink">Warenkorb{% if cart_count %} ({{ cart_count }}){% endif %}</a>
  <details class="menu">
    <summary>Menü</summary>
    <nav aria-label="Hauptmenü">
      <a href="/configure" class="cta">Jetzt konfigurieren</a>
      <a href="/">Startseite</a>
      <a href="/gutschein">Gutschein verschenken</a>
      <a href="/ueber-uns">Über uns</a>
    </nav>
  </details></div>
</header>
<main>{% block content %}{% endblock %}</main>
<footer>
  <div>&copy; 2026 Faded Art</div>
  <nav style="margin-top:.75rem"><a href="/impressum">Impressum</a><a href="/datenschutz">Datenschutz</a><a href="/agb">AGB</a><a href="/widerruf">Widerruf</a></nav>
</footer>
</div>
<script>document.addEventListener('click',e=>{const m=document.querySelector('.menu');if(m&&!m.contains(e.target))m.open=false})</script>
{% block scripts %}{% endblock %}
</body>
</html>
