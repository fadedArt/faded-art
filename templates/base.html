<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Faded Art – Ihr Foto als String Art{% endblock %}</title>
<meta name="description" content="{% block desc %}Verwandeln Sie Ihr Foto in String Art aus einem einzigen Faden. Konfigurieren, Vorschau ansehen und sicher bestellen.{% endblock %}">
<meta property="og:title" content="Faded Art">
<meta property="og:description" content="Ihr Foto als String Art aus einem einzigen Faden.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%23d4af37' stroke-width='2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="wrap">
<header class="top">
  <a href="/" class="logo gold-text">FADED ART</a>
  <div class="head-right"><a href="/warenkorb" class="cartlink">Warenkorb{% if cart_count %} ({{ cart_count }}){% endif %}</a>
  <details class="menu">
    <summary>Menü</summary>
    <nav aria-label="Hauptmenü">
      <a href="/configure" class="cta">Jetzt konfigurieren</a>
      <a href="/">Startseite</a>
      <a href="/ueber-uns">Über uns</a>
    </nav>
  </details></div>
</header>
<main>{% block content %}{% endblock %}</main>
<footer>
  <div>&copy; 2026 Faded Art</div>
  <nav style="margin-top:.75rem"><a href="/impressum">Impressum</a><a href="/datenschutz">Datenschutz</a><a href="/agb">AGB</a><a href="/widerruf">Widerruf</a></nav>
</footer>
</div>
<script>document.addEventListener('click',e=>{const m=document.querySelector('.menu');if(m&&!m.contains(e.target))m.open=false})</script>
{% block scripts %}{% endblock %}
</body>
</html>
